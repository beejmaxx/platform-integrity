[book]
title = "Adversarial Platforms"
authors = ["Bijan"]
description = "A decision framework for governing adversarial automation on digital platforms."
language = "en"
src = "."

[build]
build-dir = ".build/book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/guidebook.css"]

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.html.fold]
enable = true
level = 1
